<!doctype html>
<html><head><meta charset="utf-8"><title>render</title>
<style>body{margin:0;background:#556;color:#fff;font:12px monospace}canvas{background:transparent}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const SIZE = 1024;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE);
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8aa0, 1.6));
const key = new THREE.DirectionalLight(0xfff3e0, 2.2);
key.position.set(-3, 5, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0xaac8ff, 0.9);
rim.position.set(3, 2, -3);
scene.add(rim);

const loader = new FBXLoader();
let current = null, mixer = null, clips = [];
const BASE = '/models/FBX/';

window.R = {
    THREE, scene, renderer, cur: () => current,
    async list() { return (await (await fetch('/models.json')).json()).filter(f => f.endsWith('.fbx')); },
    async load(file) {
        if (current) scene.remove(current);
        const obj = await new Promise((res, rej) => loader.load(BASE + file, res, undefined, rej));
        current = obj; scene.add(obj);
        clips = obj.animations;
        mixer = new THREE.AnimationMixer(obj);
        const mats = [];
        obj.traverse(o => { if (o.isMesh) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => mats.push(m)); } });
        const fixed = new Set();
        for (const m of mats) {
            if (fixed.has(m)) continue; fixed.add(m);
            m.opacity = 1; m.transparent = false;          // the FBX comes with fully transparent materials
            m.color.convertLinearToSRGB();                   // colours were stored linear but loaded as sRGB
            m.shininess = 18; m.specular.setScalar(0.12);
            m.needsUpdate = true;
        }
        obj.rotation.y = THREE.MathUtils.degToRad(-35);     // face the right of the screen, turned a little toward the camera
        return { clips: clips.map(c => ({ name: c.name, dur: +c.duration.toFixed(2) })), mats: [...new Set(mats.map(m => m.name + ':' + m.color.getHexString()))] };
    },
    setColor(matName, hex) {
        current.traverse(o => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (m.name === matName) m.color.set(hex); }); });
    },
    // frame the model from the side: camera at -X looking +X so a model facing +Z looks to the screen's right
    pose(clipName, t, frame) {
        const clip = clips.find(c => c.name === clipName) || clips[0];
        mixer.stopAllAction();
        const act = mixer.clipAction(clip); act.play(); mixer.setTime(Math.min(t, clip.duration));
        current.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(current, true);
        const f = frame || { cy: (box.min.y + box.max.y) / 2, h: box.max.y - box.min.y };
        const half = f.h * 0.75;
        const cx = 0, cz = 0;
        const cam = new THREE.OrthographicCamera(-half, half, half, -half, 1, 6000);
        cam.up.set(0, 1, 0);
        cam.position.set(cx - 2000, f.cy, cz);
        cam.lookAt(cx, f.cy, cz);
        cam.updateMatrixWorld(true);
        renderer.render(scene, cam);
        return { box: [box.min.toArray(), box.max.toArray()], frame: f };
    },
    dataURL() { return renderer.domElement.toDataURL('image/png'); },
    async save(name) {
        const blob = await new Promise(r => renderer.domElement.toBlob(r, 'image/png'));
        await fetch('/save?name=' + encodeURIComponent(name), { method: 'POST', body: blob });
    },
};
window.RREADY = true;
</script></body></html>
